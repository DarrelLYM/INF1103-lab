<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" font-family="Consolas, 'Courier New', monospace" font-size="14">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
    </marker>
    <marker id="triangle" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L19,10 L1,19 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1400" height="1100" fill="#fff"/>

  <text x="20" y="34" font-size="20" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">INF1103 Lab 7 – UML Class Diagram</text>
  <text x="20" y="56" font-size="13" font-family="Segoe UI, Arial, sans-serif" fill="#555">Inventory Management System (Inheritance, Overriding, Abstract Classes, Interfaces)</text>
  <text x="20" y="76" font-size="13" font-family="Segoe UI, Arial, sans-serif" fill="#555">−  private    +  public    <tspan font-style="italic">italic</tspan> = abstract</text>

  <!-- inventory_manager (main program module) -->
  <g>
    <rect x="20" y="110" width="430" height="170" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
    <text x="235" y="130" text-anchor="middle" font-style="italic">«module»</text>
    <text x="235" y="150" text-anchor="middle" font-weight="bold">inventory_manager (Main Program)</text>
    <line x1="20" y1="160" x2="450" y2="160" stroke="#222"/>
    <text x="30" y="180">+ main() : void</text>
    <text x="30" y="198">+ add_product(inventory) : void</text>
    <text x="30" y="216">+ update_stock(inventory) : void</text>
    <text x="30" y="234">+ search_product(inventory) : void</text>
    <text x="30" y="252">+ load_inventory(inventory, file_handler)</text>
    <text x="30" y="270">+ save_inventory(inventory, file_handler)</text>
  </g>

  <!-- Inventory -->
  <g>
    <rect x="490" y="110" width="420" height="160" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="700" y="130" text-anchor="middle" font-weight="bold">Inventory</text>
    <line x1="490" y1="140" x2="910" y2="140" stroke="#222"/>
    <text x="500" y="160">- __products : list[Product]</text>
    <line x1="490" y1="168" x2="910" y2="168" stroke="#222"/>
    <text x="500" y="186">+ __init__()</text>
    <text x="500" y="204">+ add_product(product : Product) : bool</text>
    <text x="500" y="222">+ search_product(product_id : str) : Product</text>
    <text x="500" y="240">+ get_all_products() : list[Product]</text>
    <text x="500" y="258">+ display_all() : void</text>
  </g>

  <!-- FileHandler -->
  <g>
    <rect x="950" y="110" width="430" height="170" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1165" y="130" text-anchor="middle" font-weight="bold">FileHandler</text>
    <line x1="950" y1="140" x2="1380" y2="140" stroke="#222"/>
    <text x="960" y="160">- __filename : str</text>
    <line x1="950" y1="168" x2="1380" y2="168" stroke="#222"/>
    <text x="960" y="186">+ __init__(filename : str)</text>
    <text x="960" y="204">+ file_exists() : bool</text>
    <text x="960" y="222">+ load(inventory : Inventory) : void</text>
    <text x="960" y="240">+ save(inventory : Inventory) : void</text>
    <text x="960" y="258">- __create_product(item : dict) : Product</text>
  </g>

  <!-- CanBeShipped (interface-style ABC) -->
  <g>
    <rect x="20" y="420" width="380" height="100" fill="#fffbea" stroke="#222" stroke-width="1.5"/>
    <text x="210" y="440" text-anchor="middle" font-style="italic">«interface»</text>
    <text x="210" y="460" text-anchor="middle" font-weight="bold" font-style="italic">CanBeShipped</text>
    <line x1="20" y1="470" x2="400" y2="470" stroke="#222"/>
    <line x1="20" y1="478" x2="400" y2="478" stroke="#222"/>
    <text x="30" y="502" font-style="italic">+ calculate_shipping_cost() : float</text>
  </g>

  <!-- Product (abstract) -->
  <g>
    <rect x="470" y="340" width="470" height="310" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="705" y="360" text-anchor="middle" font-style="italic">«abstract»</text>
    <text x="705" y="380" text-anchor="middle" font-weight="bold" font-style="italic">Product</text>
    <line x1="470" y1="390" x2="940" y2="390" stroke="#222"/>
    <text x="480" y="410">- __product_id : str</text>
    <text x="480" y="428">- __name : str</text>
    <text x="480" y="446">- __price : float</text>
    <text x="480" y="464">- __stock : int</text>
    <line x1="470" y1="474" x2="940" y2="474" stroke="#222"/>
    <text x="480" y="494">+ __init__(product_id, name, price, stock)</text>
    <text x="480" y="512">+ get_product_id() : str</text>
    <text x="480" y="530">+ get_name() : str</text>
    <text x="480" y="548">+ get_price() : float</text>
    <text x="480" y="566">+ get_stock() : int</text>
    <text x="480" y="584">+ update_stock(quantity : int) : void</text>
    <text x="480" y="602">+ display_information() : void</text>
    <text x="480" y="620">+ to_dict() : dict</text>
    <text x="480" y="638" font-style="italic">+ get_fulfilment_info() : str {abstract}</text>
  </g>

  <!-- PhysicalProduct -->
  <g>
    <rect x="120" y="790" width="560" height="250" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="400" y="812" text-anchor="middle" font-weight="bold">PhysicalProduct</text>
    <line x1="120" y1="822" x2="680" y2="822" stroke="#222"/>
    <text x="130" y="842">+ BASE_SHIPPING_FEE : float = 5.00</text>
    <text x="130" y="860">+ RATE_PER_KG : float = 2.00</text>
    <text x="130" y="878">- __weight : float</text>
    <line x1="120" y1="888" x2="680" y2="888" stroke="#222"/>
    <text x="130" y="908">+ __init__(product_id, name, price, stock, weight)</text>
    <text x="130" y="926">+ get_weight() : float</text>
    <text x="130" y="944">+ display_information() : void</text>
    <text x="130" y="962">+ to_dict() : dict</text>
    <text x="130" y="980">+ get_fulfilment_info() : str</text>
    <text x="130" y="998">+ calculate_shipping_cost() : float</text>
  </g>

  <!-- DigitalProduct -->
  <g>
    <rect x="740" y="790" width="600" height="210" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1040" y="812" text-anchor="middle" font-weight="bold">DigitalProduct</text>
    <line x1="740" y1="822" x2="1340" y2="822" stroke="#222"/>
    <text x="750" y="842">- __download_size : float</text>
    <line x1="740" y1="852" x2="1340" y2="852" stroke="#222"/>
    <text x="750" y="872">+ __init__(product_id, name, price, stock, download_size)</text>
    <text x="750" y="890">+ get_download_size() : float</text>
    <text x="750" y="908">+ display_information() : void</text>
    <text x="750" y="926">+ to_dict() : dict</text>
    <text x="750" y="944">+ get_fulfilment_info() : str</text>
  </g>

  <g fill="none" stroke="#222" stroke-width="1.5">
    <!-- Inheritance: PhysicalProduct / DigitalProduct -> Product (solid line, hollow triangle) -->
    <polyline points="400,790 400,745 1040,745 1040,790"/>
    <line x1="705" y1="745" x2="705" y2="650" marker-end="url(#triangle)"/>
    <!-- Realisation: PhysicalProduct -> CanBeShipped (dashed line, hollow triangle) -->
    <line x1="210" y1="790" x2="210" y2="520" stroke-dasharray="8 5" marker-end="url(#triangle)"/>
    <!-- Inventory aggregates Products -->
    <line x1="700" y1="340" x2="700" y2="270" marker-end="url(#diamond)"/>
    <!-- main uses Inventory -->
    <line x1="450" y1="185" x2="490" y2="185" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <!-- main uses FileHandler -->
    <polyline points="235,110 235,90 1165,90 1165,110" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <!-- FileHandler uses Inventory -->
    <line x1="950" y1="215" x2="910" y2="215" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <!-- FileHandler creates Product subclasses when loading -->
    <polyline points="1165,280 1165,520 940,520" stroke-dasharray="6 4" marker-end="url(#open)"/>
  </g>

  <g font-size="12" font-family="Segoe UI, Arial, sans-serif" fill="#333">
    <text x="710" y="290">1</text>
    <text x="710" y="334">0..*</text>
    <text x="760" y="305" text-anchor="middle">contains</text>
    <text x="470" y="178" text-anchor="middle">«uses»</text>
    <text x="700" y="86" text-anchor="middle">«uses»</text>
    <text x="930" y="208" text-anchor="middle">«uses»</text>
    <text x="1175" y="400">«creates»</text>
    <text x="1175" y="416">PhysicalProduct /</text>
    <text x="1175" y="432">DigitalProduct</text>
    <text x="1175" y="448">(when loading)</text>
    <text x="715" y="705">inheritance (is-a)</text>
    <text x="220" y="660">implements</text>
    <text x="220" y="676">(realisation)</text>
  </g>
</svg>
